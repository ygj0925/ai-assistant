openapi: 3.1.0
info:
  title: AI Assistant Consumer API
  version: 1.0.0
  description: Versioned account, project, conversation, sharing, background job and privacy contract.
servers:
  - url: /api/assistant/v1
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
            example:
              username: sample_user
              password: sample-password-for-test
      responses:
        '201':
          $ref: '#/components/responses/Session'
        default:
          $ref: '#/components/responses/Error'
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        default:
          $ref: '#/components/responses/Error'
  /auth/me:
    parameters:
      - $ref: '#/components/parameters/Workspace'
    get:
      operationId: getAccount
      responses:
        '200':
          $ref: '#/components/responses/User'
        default:
          $ref: '#/components/responses/Error'
  /auth/me/preferences:
    parameters:
      - $ref: '#/components/parameters/Workspace'
    patch:
      operationId: updatePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesPatch'
      responses:
        '200':
          $ref: '#/components/responses/User'
        default:
          $ref: '#/components/responses/Error'
  /auth/workspaces:
    get:
      operationId: listWorkspaces
      description: Lists the authenticated account's active memberships independently of the currently selected workspace.
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Active workspace memberships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePage'
        default:
          $ref: '#/components/responses/Error'
  /auth/workspaces/{workspaceId}/leave-preview:
    parameters:
      - $ref: '#/components/parameters/WorkspacePathId'
    get:
      operationId: previewWorkspaceDeparture
      responses:
        '200':
          description: The signed-in member's current membership revision for explicit confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDeparturePreview'
        default:
          $ref: '#/components/responses/Error'
  /auth/workspaces/{workspaceId}/leave:
    parameters:
      - $ref: '#/components/parameters/WorkspacePathId'
    post:
      operationId: leaveWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceDeparture'
      responses:
        '204':
          description: The reviewed membership ended and its active actions and grants were retired.
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/devices:
    parameters:
      - $ref: '#/components/parameters/Workspace'
    get:
      operationId: listDevices
      responses:
        '200':
          description: Active device sessions for the authenticated account
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceSession'
        default:
          $ref: '#/components/responses/Error'
  /auth/devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - in: path
        name: deviceId
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    delete:
      operationId: revokeDevice
      responses:
        '204':
          description: Device access revoked
        default:
          $ref: '#/components/responses/Error'
  /auth/logout:
    parameters:
      - $ref: '#/components/parameters/Workspace'
    post:
      operationId: logout
      responses:
        '204':
          description: Current session revoked
        default:
          $ref: '#/components/responses/Error'
  /capabilities:
    parameters:
      - $ref: '#/components/parameters/Workspace'
    get:
      operationId: getCapabilities
      security:
        - {}
        - bearerAuth: []
      description: Guest discovery is allowed. An invalid supplied bearer token is rejected.
      responses:
        '200':
          description: Eligibility for the current client and account context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
              example:
                capabilities:
                  - id: text_chat
                    available: false
                    reason: SIGN_IN_REQUIRED
                    fallback: sign_in
        default:
          $ref: '#/components/responses/Error'
  /artifacts:
    parameters:
      - $ref: '#/components/parameters/Workspace'
    get:
      operationId: listArtifacts
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
        - in: query
          name: projectId
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: Owned and currently authorized private artifact summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactPage'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createArtifact
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactCreate'
      responses:
        '201':
          $ref: '#/components/responses/Artifact'
        default:
          $ref: '#/components/responses/Error'
  /artifacts/{artifactId}:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/ArtifactId'
    get:
      operationId: getArtifact
      responses:
        '200':
          $ref: '#/components/responses/Artifact'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteArtifact
      responses:
        '204':
          description: The private artifact and its versions are revoked.
        default:
          $ref: '#/components/responses/Error'
  /artifacts/{artifactId}/versions:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/ArtifactId'
    get:
      operationId: listArtifactVersions
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Existing immutable version summaries without source bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactVersionPage'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createArtifactVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactVersionWrite'
      responses:
        '201':
          $ref: '#/components/responses/Artifact'
        default:
          $ref: '#/components/responses/Error'
  /artifacts/{artifactId}/versions/{versionId}:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/ArtifactId'
      - $ref: '#/components/parameters/ArtifactVersionId'
    get:
      operationId: getArtifactVersion
      responses:
        '200':
          description: Content of the selected owned version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactVersion'
        default:
          $ref: '#/components/responses/Error'
  /artifacts/{artifactId}/versions/{versionId}/download:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/ArtifactId'
      - $ref: '#/components/parameters/ArtifactVersionId'
    get:
      operationId: downloadArtifactVersion
      responses:
        '200':
          description: Exact UTF-8 bytes as an attachment.
          content:
            text/plain:
              schema:
                type: string
                format: binary
            text/markdown:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'
  /artifacts/{artifactId}/versions/{versionId}/download-grant:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/ArtifactId'
      - $ref: '#/components/parameters/ArtifactVersionId'
    post:
      operationId: createImageArtifactDownloadGrant
      responses:
        '201':
          description: A single-use, session-bound grant for this exact image asset revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentDownloadGrant'
        default:
          $ref: '#/components/responses/Error'
  /artifacts/{artifactId}/versions/{versionId}/preview:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/ArtifactId'
      - $ref: '#/components/parameters/ArtifactVersionId'
    get:
      operationId: previewWebpageArtifact
      responses:
        '200':
          description: The current owner's exact static preview for the selected immutable webpage version.
          content:
            text/html:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/artifacts/{artifactId}/hosting:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ArtifactId'
    get:
      operationId: getHostedSite
      responses:
        '200':
          description: Current publication of the private project webpage, if present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostedSiteStatus'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: publishHostedSite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostedSiteWrite'
      responses:
        '200':
          description: Confirmed public release at the configured isolated origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostedSiteRelease'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/artifacts/{artifactId}/hosting/preview/{versionId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ArtifactId'
      - $ref: '#/components/parameters/ArtifactVersionId'
    get:
      operationId: previewHostedSite
      responses:
        '200':
          description: Digest and version of the selected private preview candidate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostedSitePreview'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/artifacts/{artifactId}/hosting/{releaseRevision}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ArtifactId'
      - name: releaseRevision
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: revokeHostedSite
      responses:
        '204':
          description: Exact public release retired.
        default:
          $ref: '#/components/responses/Error'
  /artifacts/{artifactId}/rollback:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/ArtifactId'
    post:
      operationId: rollbackArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactRollback'
      responses:
        '201':
          $ref: '#/components/responses/Artifact'
        default:
          $ref: '#/components/responses/Error'
  /catalog/items:
    get:
      operationId: listReviewedCatalog
      parameters:
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/ReviewedCatalogKind'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Live approved entries visible to a current consumer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewedCatalogPage'
        default:
          $ref: '#/components/responses/Error'
  /catalog/items/{entryId}:
    parameters:
      - name: entryId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    get:
      operationId: getReviewedCatalogItem
      responses:
        '200':
          description: Current reviewed exact public disclosure to authenticated consumers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewedCatalogItem'
        default:
          $ref: '#/components/responses/Error'
  /catalog/items/{entryId}/reports:
    parameters:
      - name: entryId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    post:
      operationId: reportReviewedCatalogItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewedCatalogReportWrite'
      responses:
        '200':
          $ref: '#/components/responses/ReviewedCatalogReport'
        '201':
          $ref: '#/components/responses/ReviewedCatalogReport'
        default:
          $ref: '#/components/responses/Error'
  /catalog/author/preview:
    post:
      operationId: previewCatalogRelease
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogReleaseSource'
      responses:
        '200':
          description: Exact author disclosure and its digest for confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogReleasePreview'
        default:
          $ref: '#/components/responses/Error'
  /catalog/author/releases:
    get:
      operationId: listCatalogAuthorReleases
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Current author's retained release requests and decisions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogReleasePage'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: submitCatalogRelease
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogReleaseWrite'
      responses:
        '201':
          $ref: '#/components/responses/CatalogRelease'
        default:
          $ref: '#/components/responses/Error'
  /catalog/author/releases/{releaseId}/withdraw:
    parameters:
      - name: releaseId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    post:
      operationId: withdrawCatalogRelease
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: boolean
                  const: true
      responses:
        '200':
          $ref: '#/components/responses/CatalogRelease'
        default:
          $ref: '#/components/responses/Error'
  /custom-assistants:
    parameters:
      - $ref: '#/components/parameters/Workspace'
    get:
      operationId: listCustomAssistants
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: One page of private owned custom assistants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomAssistantPage'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createCustomAssistant
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomAssistantCreate'
      responses:
        '201':
          description: The created custom assistant and its first immutable version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomAssistant'
        default:
          $ref: '#/components/responses/Error'
  /custom-assistants/{assistantId}:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/CustomAssistantId'
    get:
      operationId: getCustomAssistant
      responses:
        '200':
          description: The current owned custom assistant and its head version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomAssistant'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteCustomAssistant
      responses:
        '204':
          description: The custom assistant and its version history have been revoked.
        default:
          $ref: '#/components/responses/Error'
  /custom-assistants/{assistantId}/versions:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/CustomAssistantId'
    get:
      operationId: listCustomAssistantVersions
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: An owned assistant's version history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomAssistantVersionPage'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createCustomAssistantVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomAssistantVersionWrite'
      responses:
        '201':
          description: The new immutable head after validating the previous head.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomAssistant'
        default:
          $ref: '#/components/responses/Error'
  /custom-assistants/{assistantId}/versions/{versionId}:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/CustomAssistantId'
      - $ref: '#/components/parameters/CustomAssistantVersionId'
    get:
      operationId: getCustomAssistantVersion
      responses:
        '200':
          description: One owned historical version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomAssistantVersion'
        default:
          $ref: '#/components/responses/Error'
  /custom-assistants/{assistantId}/rollback:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/CustomAssistantId'
    post:
      operationId: rollbackCustomAssistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomAssistantRollback'
      responses:
        '201':
          description: A new head copied from an authorized historical version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomAssistant'
        default:
          $ref: '#/components/responses/Error'
  /automations/reminders:
    parameters:
      - $ref: '#/components/parameters/Workspace'
    get:
      operationId: listReminders
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: A page of reminders owned by the current account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderPage'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createReminder
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderInput'
      responses:
        '201':
          $ref: '#/components/responses/Reminder'
        default:
          $ref: '#/components/responses/Error'
  /automations/reminders/{reminderId}:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/ReminderId'
    get:
      operationId: getReminder
      responses:
        '200':
          $ref: '#/components/responses/Reminder'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateReminderState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active:
                  type: boolean
      responses:
        '200':
          $ref: '#/components/responses/Reminder'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteReminder
      responses:
        '204':
          description: Reminder and its occurrence history revoked.
        default:
          $ref: '#/components/responses/Error'
  /automations/reminders/{reminderId}/share-preview:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/ReminderId'
    post:
      operationId: previewReminderShare
      responses:
        '200':
          description: The exact future calendar and in-app delivery fields available to share.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderSharePreview'
        default:
          $ref: '#/components/responses/Error'
  /automations/reminders/{reminderId}/shares:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/ReminderId'
    get:
      operationId: listReminderShares
      responses:
        '200':
          description: The source owner's share metadata without reuse tokens.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReminderShareInfo'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: publishReminderShare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderShareRevision'
      responses:
        '201':
          description: A revocable share and the token returned at publication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderSharePublished'
        default:
          $ref: '#/components/responses/Error'
  /automations/reminder-shares/{shareId}:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - in: path
        name: shareId
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    delete:
      operationId: revokeReminderShare
      responses:
        '204':
          description: Future previews and applications of the share are revoked.
        default:
          $ref: '#/components/responses/Error'
  /automations/reminder-shares/read:
    parameters:
      - $ref: '#/components/parameters/Workspace'
    post:
      operationId: readReminderShare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderShareTokenInput'
      responses:
        '200':
          description: The authenticated recipient's preview, without publisher identity or history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderShareView'
        default:
          $ref: '#/components/responses/Error'
  /automations/reminder-shares/apply:
    parameters:
      - $ref: '#/components/parameters/Workspace'
    post:
      operationId: applyReminderShare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderShareApply'
      responses:
        '201':
          description: The recipient's independent in-app reminder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminder'
        default:
          $ref: '#/components/responses/Error'
  /automations/reminder-occurrences:
    parameters:
      - $ref: '#/components/parameters/Workspace'
    get:
      operationId: listReminderOccurrences
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - in: query
