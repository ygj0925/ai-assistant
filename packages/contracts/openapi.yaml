        required: true
        schema:
          $ref: '#/components/schemas/Id'
    get:
      operationId: getMessageProjectMemorySources
      responses:
        '200':
          description: The project memories used for this reply, with each source checked against current permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemorySources'
        default:
          $ref: '#/components/responses/Error'
  /conversations/{conversationId}/share-previews:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/ConversationId'
    post:
      operationId: previewShare
      description: Previews the exact text and audience before creating a share. The revision must be confirmed when publishing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareSelection'
      responses:
        '200':
          description: An unpublished text snapshot preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharePreview'
        default:
          $ref: '#/components/responses/Error'
  /conversations/{conversationId}/shares:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/ConversationId'
    get:
      operationId: listShares
      description: Lists the owner's sharing records without private access tokens or message content.
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: One page of sharing records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharePage'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createShare
      description: Confirms the preview revision and publishes an expiring text snapshot. The access token is returned once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareCreate'
      responses:
        '201':
          description: Published share and its private access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharePublished'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /shares/{shareId}:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/ShareId'
    delete:
      operationId: revokeShare
      responses:
        '204':
          description: Removed access through the original link. Copies created by authorized recipients are independent.
        default:
          $ref: '#/components/responses/Error'
  /shares/read:
    parameters:
      - $ref: '#/components/parameters/Workspace'
    post:
      operationId: readShare
      description: Reads a text snapshot. Workspace links require a current authorized member. Send the share token in the body.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareAccess'
      responses:
        '200':
          description: The authorized text snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareView'
        default:
          $ref: '#/components/responses/Error'
  /shares/copy:
    parameters:
      - $ref: '#/components/parameters/Workspace'
    post:
      operationId: copyShare
      description: Copies an authorized snapshot into the recipient's workspace. Repeated requests for the same share and recipient return the existing copy while the link remains authorized.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareAccess'
      responses:
        '201':
          $ref: '#/components/responses/Conversation'
        default:
          $ref: '#/components/responses/Error'
  /conversations/{conversationId}/exports:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/ConversationId'
    post:
      operationId: queueConversationExport
      description: Queues an owned message branch as a background Markdown export. Retrying the same request with the same key returns its current job. Reusing the key for a different branch returns CONFLICT.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9._~-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationExportRequest'
      responses:
        '202':
          $ref: '#/components/responses/Job'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /jobs:
    parameters:
      - $ref: '#/components/parameters/Workspace'
    get:
      operationId: listJobs
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: A page of background jobs in the current account and workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPage'
        default:
          $ref: '#/components/responses/Error'
  /jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/JobId'
    get:
      operationId: getJob
      responses:
        '200':
          $ref: '#/components/responses/Job'
        default:
          $ref: '#/components/responses/Error'
  /jobs/{jobId}/cancel:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/JobId'
    post:
      operationId: cancelJob
      description: Cancels queued or running work. A repeated request or a completed job returns its current outcome.
      responses:
        '200':
          $ref: '#/components/responses/Job'
        default:
          $ref: '#/components/responses/Error'
  /jobs/{jobId}/artifact:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/JobId'
    get:
      operationId: downloadJobArtifact
      description: Downloads the UTF-8 Markdown artifact of a completed, still accessible conversation export.
      responses:
        '200':
          description: Download attachment
          headers:
            Content-Disposition:
              schema:
                type: string
              example: 'attachment; filename="conversation-export.md"'
          content:
            text/markdown:
              schema:
                type: string
                format: binary
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /conversations/{conversationId}/runs:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/ConversationId'
    post:
      operationId: startRun
      description: Retrying the same body and target with the same key returns the original run. Reusing the key with a different request returns CONFLICT.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9._~-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
            example:
              action: send
              content: '你好'
      responses:
        '202':
          $ref: '#/components/responses/RunSnapshot'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getRunSnapshot
      responses:
        '200':
          $ref: '#/components/responses/RunSnapshot'
        default:
          $ref: '#/components/responses/Error'
  /runs/{runId}/cancel:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: cancelRun
      description: Repeated cancel returns the current snapshot. A cancellation races with completion and preserves the single committed terminal state.
      responses:
        '200':
          $ref: '#/components/responses/RunSnapshot'
        default:
          $ref: '#/components/responses/Error'
  /runs/{runId}/events:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: streamRunEvents
      description: Ordered UTF-8 SSE stream. Disconnecting never cancels a run. On an expired cursor, retrieve the snapshot and reconnect after its lastSequence if the run is active.
      parameters:
        - in: header
          name: Last-Event-ID
          description: Last applied sequence for this run. A missing header starts from the first event.
          schema:
            type: string
            pattern: '^(0|[1-9][0-9]*)$'
      responses:
        '200':
          description: Each frame carries the sequence as id, the type as event and a RunEvent JSON object as data. Heartbeats are comments.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                id: 1
                event: run.started
                data: {"runId":"run_example","sequence":1,"type":"run.started"}

                id: 2
                event: message.delta
                data: {"runId":"run_example","sequence":2,"type":"message.delta","delta":"你好！"}

                id: 3
                event: run.completed
                data: {"runId":"run_example","sequence":3,"type":"run.completed","messageId":"message_example"}

        '410':
          $ref: '#/components/responses/ExpiredCursor'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    WorkspacePathId:
      in: path
      name: workspaceId
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    Workspace:
      in: header
      name: X-Workspace-Id
      description: Optional requested workspace. Server verifies membership and access for the authenticated account.
      schema:
        $ref: '#/components/schemas/Id'
    ConversationId:
      in: path
      name: conversationId
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    CustomAssistantId:
      in: path
      name: assistantId
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    CustomAssistantVersionId:
      in: path
      name: versionId
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    OrganizationMemberId:
      name: accountId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    SyntheticProductId:
      name: productId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    EventReminderId:
      name: eventReminderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    SandboxConnectorActionId:
      name: actionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ReminderId:
      in: path
      name: reminderId
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ResearchId:
      in: path
      name: researchId
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    AttachmentId:
      in: path
      name: attachmentId
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ArtifactId:
      in: path
      name: artifactId
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ArtifactVersionId:
      in: path
      name: versionId
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ProjectInvitationId:
      in: path
      name: inviteId
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ArtifactPublicationId:
      in: path
      name: publicationId
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    SharedDraftId:
      name: draftId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    SharedDraftRevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ProjectId:
      in: path
      name: projectId
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ShareId:
      in: path
      name: shareId
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    JobId:
      in: path
      name: jobId
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    AnalysisId:
      in: path
      name: analysisId
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    RunId:
      in: path
      name: runId
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    PageCursor:
      in: query
      name: cursor
      description: Server-issued opaque cursor tied to this collection and its query. Omit to start at the first page.
      schema:
        type: string
        minLength: 1
    PageLimit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    ProjectSharedDraftSaved:
      description: A new immutable shared revision became the current head.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectSharedDraft'
    ProjectInvitation:
      description: An invitation or currently accepted explicit role grant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectInvitation'
    ProjectInvitations:
      description: Scoped pending invitations or accepted grants as applicable to the caller.
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectInvitation'
    SharedProjectMaterial:
      description: Content explicitly added to the collaborative text section.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharedProjectMaterial'
    Artifact:
      description: Currently authorized private artifact and immutable head.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Artifact'
    AnalysisSummary:
      description: Numeric results and chart data in the caller's current workspace.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnalysisSummary'
    ProjectAttachment:
      description: Attachment state and public metadata in the owned project
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectAttachment'
    ProjectAudioAttachment:
      description: Status and validated format of a privately owned PCM audio attachment
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectAudioAttachment'
    ProjectPdfAttachment:
      description: Current private PDF upload or text extraction state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectPdfAttachment'
    ProjectResource:
      description: Private text material belonging to the owned project.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectResource'
    Reminder:
      description: An owned reminder and its current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Reminder'
    SandboxEventReminder:
      description: An authorized synthetic connector event subscription.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SandboxEventReminder'
    SandboxEventReminders:
      description: Current consumer's authorized and retired event subscriptions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SandboxEventReminders'
    SandboxEventReminderOccurrence:
      description: One notification or scheduled attempt in the current subscription.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SandboxEventReminderOccurrence'
    SandboxEventReminderOccurrencePage:
      description: Authorized event notification page.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SandboxEventReminderOccurrencePage'
    SandboxReminderEventResult:
      description: Number of new, duplicate and skipped deliveries for the verified operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SandboxReminderEventResult'
    CatalogRelease:
      description: The status of one exact submission or published revision.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CatalogRelease'
    ReviewedCatalogReport:
      description: Recorded report against a specific reviewed release.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReviewedCatalogReport'
    OrganizationPolicy:
      description: Owner-reviewed model and connector policy for the current organization.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrganizationPolicy'
    OrganizationModelBudget:
      description: Owner-reviewed monthly model output budget and scoped usage for the selected organization.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrganizationModelBudget'
    ProactivePreferences:
      description: Own proactively authorized preferences for the selected workspace.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProactivePreferences'
    SandboxConnectorAuthorization:
      description: Current test connector authorization.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SandboxConnectorAuthorization'
    SandboxConnectorAction:
      description: Current status of a fixed synthetic action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SandboxConnectorAction'
    ResearchTask:
      description: The owned plan revision and durable execution state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResearchTask'
    ManualMemory:
      description: Authorized user-created memory
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManualMemory'
    RetrievalAnswer:
      description: Claims and their supporting sources with current availability
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RetrievalAnswer'
    ReportReceipt:
      description: The caller's report receipt. Contains only the report and target metadata.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReportReceipt'
    Session:
      description: An authenticated consumer session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountSession'
    User:
      description: Current account
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/User'
    Error:
      description: See the stable application code in the envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ExpiredCursor:
      description: Requested replay is no longer retained. Retrieve the run snapshot.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiError'
              - type: object
                properties:
                  code:
                    const: CURSOR_EXPIRED
    Conversation:
      description: A conversation visible to this account
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Conversation'
    Project:
      description: Metadata of one owned private project
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Project'
    Job:
      description: Authoritative snapshot of one authorized job
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Job'
    RunSnapshot:
      description: Authoritative snapshot and corresponding replay cursor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RunSnapshot'
  schemas:
    Id:
      type: string
      minLength: 1
      description: An opaque resource identifier carried as a string.
    Timestamp:
      type: string
      format: date-time
    UsageAmount:
      description: A non-negative count. Values at or above 9007199254740991 are decimal strings.
      oneOf:
        - type: integer
          minimum: 0
          maximum: 9007199254740990
        - type: string
          pattern: '^[1-9][0-9]{15,18}$'
    AccountUsage:
      type: object
      required: [limit, reserved, used, available, unit]
      properties:
        limit:
          $ref: '#/components/schemas/UsageAmount'
        reserved:
          $ref: '#/components/schemas/UsageAmount'
        used:
          $ref: '#/components/schemas/UsageAmount'
        available:
          $ref: '#/components/schemas/UsageAmount'
        unit:
          type: string
          const: output_code_points
    ExportPage:
      type: object
      required: [schemaVersion, exportedAt, workspaceId, account, conversations, messages, runs, nextCursor]
      properties:
        schemaVersion:
          type: integer
          const: 1
        exportedAt:
          $ref: '#/components/schemas/Timestamp'
        workspaceId:
          $ref: '#/components/schemas/Id'
        account:
          $ref: '#/components/schemas/ExportProfile'
        projects:
          type: array
          description: Owned projects in this export page. Older servers may omit this field.
          items:
            $ref: '#/components/schemas/Project'
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/ExportConversation'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ExportMessage'
        runs:
          type: array
          items:
            $ref: '#/components/schemas/ExportRun'
        projectResources:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/ProjectResource'
              - type: object
                required: [projectId]
                properties:
                  projectId:
                    $ref: '#/components/schemas/Id'
        analyses:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/AnalysisSummary'
              - type: object
                required: [artifactCsv]
                properties:
                  artifactCsv:
                    type: string
        memorySettings:
          type: array
          items:
            $ref: '#/components/schemas/ExportMemorySetting'
        memoryEntries:
          type: array
          description: Retained manual memories for the owner-initiated export, including previously saved entries from disabled scopes.
          items:
            $ref: '#/components/schemas/ExportMemoryEntry'
        attachments:
          type: array
          description: Metadata for approved private attachments. Downloading the bytes requires a separate current grant.
          items:
            $ref: '#/components/schemas/ExportAttachment'
        catalogAuthoredReleases:
          type: array
          description: Portable receipts for the account's submissions in the selected authoring workspace.
          items:
            $ref: '#/components/schemas/CatalogRelease'
        catalogReports:
          type: array
          description: Portable receipts for the account's own catalogue reports in their personal workspace.
          items:
            $ref: '#/components/schemas/ReviewedCatalogReport'
        nextCursor:
          type: [string, 'null']
          description: Continuation for the same account and workspace, or null on the last page.
    ExportMemorySetting:
      oneOf:
        - type: object
          required: [scope, enabled, referenceHistory, instructions]
          properties:
            scope:
              const: personal
            enabled:
              type: boolean
            referenceHistory:
              type: boolean
            instructions:
              type: string
        - type: object
          required: [scope, projectId, enabled]
          properties:
            scope:
              const: project
            projectId:
              $ref: '#/components/schemas/Id'
            enabled:
              type: boolean
    ExportMemoryEntry:
      allOf:
        - type: object
          required: [id, content, createdAt]
          properties:
            id:
              $ref: '#/components/schemas/Id'
            content:
              type: string
            createdAt:
              $ref: '#/components/schemas/Timestamp'
        - oneOf:
            - type: object
              required: [scope]
              properties:
                scope:
                  const: personal
            - type: object
              required: [scope, projectId]
              properties:
                scope:
                  const: project
                projectId:
                  $ref: '#/components/schemas/Id'
    ExportAttachment:
      type: object
      required: [id, projectId, size, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        projectId:
          $ref: '#/components/schemas/Id'
        size:
          type: integer
          minimum: 1
          maximum: 1048576
        createdAt:
          $ref: '#/components/schemas/Timestamp'
      oneOf:
        - type: object
          required: [contentType, width, height]
          properties:
            contentType:
              const: image/png
            width:
              type: integer
              minimum: 1
              maximum: 2048
            height:
              type: integer
              minimum: 1
              maximum: 2048
        - type: object
          required: [contentType, audio]
          properties:
            contentType:
              const: audio/wav
            audio:
              $ref: '#/components/schemas/AudioAttachmentFormat'
        - type: object
          required: [contentType]
          properties:
            contentType:
              const: text/plain
    ExportProfile:
      type: object
      required: [id, username, preferences, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        username:
          $ref: '#/components/schemas/Username'
        preferences:
          $ref: '#/components/schemas/Preferences'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    ExportConversation:
      allOf:
        - $ref: '#/components/schemas/Conversation'
        - type: object
          required: [createdAt]
          properties:
            createdAt:
              $ref: '#/components/schemas/Timestamp'
    ExportMessage:
      type: object
      required: [id, conversationId, parentId, role, content, createdAt]
      properties:
        id:
