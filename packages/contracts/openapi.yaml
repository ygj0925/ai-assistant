          items:
            $ref: '#/components/schemas/ResearchSource'
        nextCursor:
          type: [string, 'null']
    ResearchTaskPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ResearchTask'
        nextCursor:
          type: [string, 'null']
    TemporaryChatPrompt:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 512
    TemporaryChatReply:
      type: object
      required: [content, modelId]
      properties:
        content:
          type: string
        modelId:
          type: string
          const: local-echo
    ConversationPatch:
      type: object
      properties:
        title:
          type: string
        pinned:
          type: boolean
        archived:
          type: boolean
    Conversation:
      type: object
      required: [id, title, pinned, archived, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        title:
          type: string
        pinned:
          type: boolean
        archived:
          type: boolean
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        projectId:
          $ref: '#/components/schemas/Id'
        sharingRestricted:
          description: Whether new or outstanding share links are blocked for this conversation. Older servers may omit this property.
          type: boolean
    LockedConversationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id:
                $ref: '#/components/schemas/Id'
        nextCursor:
          type: [string, 'null']
    ConversationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
        nextCursor:
          type: [string, 'null']
    MessagePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        nextCursor:
          type: [string, 'null']
    Message:
      type: object
      required: [id, parentId, role, content, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        parentId:
          type: [string, 'null']
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        generation:
          $ref: '#/components/schemas/MessageGeneration'
    MessageGeneration:
      type: object
      required: [modelId, modelVersion]
      properties:
        modelId:
          $ref: '#/components/schemas/Id'
        modelVersion:
          type: string
        context:
          $ref: '#/components/schemas/RunContext'
        fallbackFromModelId:
          $ref: '#/components/schemas/Id'
        historyReferenceUsed:
          type: boolean
          description: This completed reply consumed an explicitly selected prior reply.
        projectMemorySourcesUsed:
          type: boolean
          description: This completed reply used remembered material from its own project.
    ConversationExportRequest:
      type: object
      required: [sourceMessageId]
      properties:
        sourceMessageId:
          $ref: '#/components/schemas/Id'
    Job:
      type: object
      required: [id, kind, conversationId, sourceMessageId, status, progress, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          const: conversation_export
        conversationId:
          $ref: '#/components/schemas/Id'
        sourceMessageId:
          $ref: '#/components/schemas/Id'
        status:
          type: string
          enum: [queued, running, completed, cancelled, failed]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        artifactId:
          $ref: '#/components/schemas/Id'
        errorCode:
          type: string
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    JobPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        nextCursor:
          type: [string, 'null']
    RunContext:
      type: object
      required: [budget, used, turns, trimmed]
      properties:
        budget:
          type: integer
          minimum: 1
          description: Maximum input in Unicode code points for this run.
        used:
          type: integer
          minimum: 1
          description: Selected input size in Unicode code points.
        turns:
          type: integer
          minimum: 1
          maximum: 32
          description: Number of selected messages.
        trimmed:
          type: boolean
          description: The run omitted older messages on the selected branch.
    RunRequest:
      oneOf:
        - $ref: '#/components/schemas/SendRun'
        - $ref: '#/components/schemas/EditRun'
        - $ref: '#/components/schemas/RegenerateRun'
    CustomAssistantSelection:
      type: object
      required: [id, versionId]
      description: An explicit version of an owned custom assistant for an eligible local model and matching conversation scope.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        versionId:
          $ref: '#/components/schemas/Id'
    HistoryReferenceSelection:
      type: object
      required: [sourceConversationId, sourceMessageId]
      properties:
        sourceConversationId:
          $ref: '#/components/schemas/Id'
        sourceMessageId:
          $ref: '#/components/schemas/Id'
      description: One explicitly selected completed reply from a distinct owned personal conversation.
    HistoryReferenceReceipt:
      oneOf:
        - allOf:
            - $ref: '#/components/schemas/HistoryReferenceSelection'
            - type: object
              required: [kind, status]
              properties:
                kind:
                  const: history_reply
                status:
                  const: available
        - type: object
          required: [kind, status]
          properties:
            kind:
              const: history_reply
            status:
              const: unavailable
    ProjectMemorySources:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 3
          items:
            oneOf:
              - type: object
                required: [status, entryId, excerpt]
                properties:
                  status:
                    const: available
                  entryId:
                    $ref: '#/components/schemas/Id'
                  excerpt:
                    type: string
                    maxLength: 120
              - type: object
                required: [status]
                properties:
                  status:
                    const: unavailable
    SendRun:
      type: object
      required: [action, content]
      properties:
        action:
          const: send
        content:
          type: string
          minLength: 1
        parentId:
          $ref: '#/components/schemas/Id'
        modelId:
          $ref: '#/components/schemas/Id'
        customAssistant:
          $ref: '#/components/schemas/CustomAssistantSelection'
        historyReference:
          $ref: '#/components/schemas/HistoryReferenceSelection'
    EditRun:
      type: object
      required: [action, messageId, content]
      properties:
        action:
          const: edit
        messageId:
          $ref: '#/components/schemas/Id'
        content:
          type: string
          minLength: 1
        modelId:
          $ref: '#/components/schemas/Id'
        customAssistant:
          $ref: '#/components/schemas/CustomAssistantSelection'
    RegenerateRun:
      type: object
      required: [action, messageId]
      properties:
        action:
          const: regenerate
        messageId:
          $ref: '#/components/schemas/Id'
        modelId:
          $ref: '#/components/schemas/Id'
        customAssistant:
          $ref: '#/components/schemas/CustomAssistantSelection'
    RunSnapshot:
      type: object
      required: [runId, conversationId, state, lastSequence, content]
      properties:
        runId:
          $ref: '#/components/schemas/Id'
        conversationId:
          $ref: '#/components/schemas/Id'
        state:
          type: string
          enum: [queued, running, completed, cancelled, failed]
        lastSequence:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        content:
          type: string
        messageId:
          $ref: '#/components/schemas/Id'
        modelId:
          $ref: '#/components/schemas/Id'
        modelVersion:
          type: string
        context:
          $ref: '#/components/schemas/RunContext'
        fallbackFromModelId:
          $ref: '#/components/schemas/Id'
        error:
          $ref: '#/components/schemas/ApiError'
        customAssistant:
          $ref: '#/components/schemas/CustomAssistantSelection'
    RunEvent:
      oneOf:
        - $ref: '#/components/schemas/RunStarted'
        - $ref: '#/components/schemas/MessageDelta'
        - $ref: '#/components/schemas/RunCompleted'
        - $ref: '#/components/schemas/RunCancelled'
        - $ref: '#/components/schemas/RunFailed'
    RunEventBase:
      type: object
      required: [runId, sequence]
      properties:
        runId:
          $ref: '#/components/schemas/Id'
        sequence:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    RunStarted:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type]
          properties:
            type:
              const: run.started
    MessageDelta:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type, delta]
          properties:
            type:
              const: message.delta
            delta:
              type: string
    RunCompleted:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type, messageId]
          properties:
            type:
              const: run.completed
            messageId:
              $ref: '#/components/schemas/Id'
    RunCancelled:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type]
          properties:
            type:
              const: run.cancelled
    RunFailed:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type, error]
          properties:
            type:
              const: run.failed
            error:
              $ref: '#/components/schemas/ApiError'
