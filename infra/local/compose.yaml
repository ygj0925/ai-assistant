name: ai-assistant-local

services:
  postgres:
    image: ${ASSISTANT_POSTGRES_IMAGE:-postgres:16.16-alpine}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ASSISTANT_PG_ADMIN_PASSWORD:?Run node infra/local/init-env.mjs first}
      POSTGRES_DB: postgres
      ASSISTANT_DB_PASSWORD: ${ASSISTANT_DB_PASSWORD:?Run node infra/local/init-env.mjs first}
      ASSISTANT_QA_DB_PASSWORD: ${ASSISTANT_QA_DB_PASSWORD:?Run node infra/local/init-env.mjs first}
    ports:
      - '127.0.0.1:${ASSISTANT_POSTGRES_PORT:-25432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-assistant-roles.sql:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'postgres', '-d', 'postgres']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: ${ASSISTANT_REDIS_IMAGE:-redis:7.2.17-alpine}
    environment:
      REDISCLI_AUTH: ${ASSISTANT_REDIS_PASSWORD:?Run node infra/local/init-env.mjs first}
    command: ['sh', '-ec', 'exec redis-server --requirepass "$$REDISCLI_AUTH"']
    ports:
      - '127.0.0.1:${ASSISTANT_REDIS_PORT:-26379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-e', 'PING']
      interval: 3s
      timeout: 3s
      retries: 20

  object-store:
    image: ${ASSISTANT_S3_IMAGE:-ghcr.io/chrislusf/seaweedfs:4.53}
    command: ['mini', '-dir=/data', '-ip.bind=0.0.0.0', '-webdav=false', '-admin.ui=false']
    environment:
      AWS_ACCESS_KEY_ID: ${ASSISTANT_S3_ACCESS_KEY:?Run node infra/local/init-env.mjs first}
      AWS_SECRET_ACCESS_KEY: ${ASSISTANT_S3_SECRET_KEY:?Run node infra/local/init-env.mjs first}
      S3_BUCKET: assistant-local
    ports:
      - '127.0.0.1:${ASSISTANT_S3_PORT:-28333}:8333'
    volumes:
      - object-data:/data

volumes:
  postgres-data:
  object-data:
